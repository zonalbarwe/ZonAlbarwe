name: Playwright 50-Workers Bot

on:
  workflow_dispatch:
    inputs:
      proxy_choice:
        description: 'Use Free Proxies? (y/n)'
        required: true
        default: 'y'
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests

      - name: Install Playwright Chromium Browser
        run: playwright install chromium

      - name: Run Bot Script
        env:
          TOTAL_TASKS: '50'
          CONCURRENT_WORKERS: '50'
          WAIT_TIME: '5'
          PROXY_CHOICE: 'y'
          PROXY_TYPE: 'free'
        run: python bot.py
